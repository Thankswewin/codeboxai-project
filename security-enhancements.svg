<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dark blue background grid -->
  <rect width="1024" height="1024" fill="#002642" />
  <path d="M0 0h1024v1024H0z" fill="#002642" />
  
  <!-- Grid lines -->
  <g stroke="#003a61" stroke-width="2">
    <path d="M0 102.4h1024M0 204.8h1024M0 307.2h1024M0 409.6h1024M0 512h1024M0 614.4h1024M0 716.8h1024M0 819.2h1024M0 921.6h1024" />
    <path d="M102.4 0v1024M204.8 0v1024M307.2 0v1024M409.6 0v1024M512 0v1024M614.4 0v1024M716.8 0v1024M819.2 0v1024M921.6 0v1024" />
  </g>
  
  <!-- Title -->
  <text x="75" y="100" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#ffffff">Security</text>
  <text x="75" y="180" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="#ffffff">Enhancements</text>
  
  <!-- Main Shield -->
  <g transform="translate(512, 500) scale(1.2)">
    <path d="M0 -150 C-100 -150 -150 -100 -150 0 C-150 150 0 200 0 200 C0 200 150 150 150 0 C150 -100 100 -150 0 -150z" fill="#0066cc" stroke="#004999" stroke-width="10" />
    <path d="M0 -120 C-80 -120 -120 -80 -120 0 C-120 120 0 160 0 160 C0 160 120 120 120 0 C120 -80 80 -120 0 -120z" fill="#ffcc00" stroke="#e6b800" stroke-width="5" />
    
    <!-- Lock in shield -->
    <g transform="translate(0, 20) scale(0.8)">
      <rect x="-40" y="-20" width="80" height="80" rx="10" ry="10" fill="#ff6600" />
      <rect x="-30" y="-60" width="60" height="40" rx="10" ry="10" fill="#ff6600" />
      <circle cx="0" cy="20" r="15" fill="#002642" />
      <rect x="-5" y="5" width="10" height="30" fill="#002642" />
    </g>
  </g>
  
  <!-- Red Lock -->
  <g transform="translate(190, 350)">
    <rect x="-40" y="20" width="80" height="80" rx="10" ry="10" fill="#ff3333" />
    <rect x="-30" y="-20" width="60" height="40" rx="10" ry="10" fill="#ff3333" />
    <circle cx="0" cy="60" r="15" fill="#002642" />
    <rect x="-5" y="45" width="10" height="30" fill="#002642" />
  </g>
  
  <!-- Verification Check -->
  <g transform="translate(800, 320)">
    <circle cx="0" cy="0" r="60" fill="#ff9900" />
    <path d="M-25 0 L-5 20 L30 -15" stroke="#ffff00" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Document Icon -->
  <g transform="translate(180, 580)">
    <rect x="-50" y="-60" width="100" height="120" rx="5" ry="5" fill="#0099cc" />
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#002642" stroke-width="8" />
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#002642" stroke-width="8" />
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#002642" stroke-width="8" />
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#002642" stroke-width="8" />
  </g>
  
  <!-- Cyan Keys -->
  <g transform="translate(850, 580)">
    <circle cx="0" cy="0" r="30" fill="#00cccc" />
    <rect x="30" y="-10" width="60" height="20" fill="#00cccc" />
    <rect x="70" y="-20" width="20" height="10" fill="#00cccc" />
    <rect x="70" y="10" width="20" height="10" fill="#00cccc" />
  </g>
  
  <!-- Cyan Key Bottom -->
  <g transform="translate(500, 830)">
    <circle cx="0" cy="0" r="30" fill="#00cccc" />
    <rect x="30" y="-10" width="60" height="20" fill="#00cccc" />
    <rect x="70" y="-20" width="20" height="10" fill="#00cccc" />
    <rect x="70" y="10" width="20" height="10" fill="#00cccc" />
  </g>
  
  <!-- Refresh Icon -->
  <g transform="translate(800, 800)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff3333" stroke-width="15" />
    <path d="M0 -50 A50 50 0 0 1 50 0" fill="none" stroke="#ff3333" stroke-width="15" />
    <path d="M50 0 L70 -20 M50 0 L30 -20" fill="none" stroke="#ff3333" stroke-width="15" stroke-linecap="round" />
  </g>
  
  <!-- Decorative Lines -->
  <g stroke="#0066cc" stroke-width="10" stroke-linecap="round">
    <line x1="100" y1="250" x2="300" y2="250" />
    <line x1="700" y1="450" x2="900" y2="450" />
    <line x1="100" y1="750" x2="350" y2="750" />
    <line x1="100" y1="800" x2="250" y2="800" />
    <line x1="100" y1="850" x2="300" y2="850" />
    <line x1="500" y1="930" x2="600" y2="930" />
    <line x1="700" y1="700" x2="850" y2="700" />
    <line x1="700" y1="750" x2="800" y2="750" />
  </g>
</svg>